<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chat with your PDFs — grounded answers with automatic RAG routing and source attribution." />
    <title>DocIntel-AI</title>
    <!-- Apply the saved (or OS-preferred) theme before first paint to avoid a
         flash of the wrong theme. Kept in sync with src/hooks/useTheme.ts. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('docintel-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
